<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Références chantiers ID Maîtrise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --sea:#2D7596; --sea-2:#1B5670; --shore:#7FC4DA; --land-1:#DDEBC9; --land-2:#D1E3B9; --land-3:#E6EFD6; --land-4:#C8DDAE; --land-city:#F2E3C6; --land-hi:#FFD9C2; --border:#FFFFFF; --label:#2E4A33; --halo:#FFFFFF;
  --ink:#16303F; --muted:#5D6F77; --panel:#FFFFFF; --line:#E1E7E8; --accent:#E0492A; --accent-ink:#FFFFFF;
  --shadow:0 10px 30px rgba(22,48,63,.18);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--sea:#123F55;--sea-2:#0A2A3A;--shore:#2E7C98;--land-1:#223528;--land-2:#1D3023;--land-3:#28392C;--land-4:#1A2B1F;--land-city:#3A3223;--land-hi:#5A3122;--border:#0F1C14;--label:#CFE3C8;--halo:#14231A;
  --ink:#E5ECEE;--muted:#9AABB2;--panel:#131E24;--line:#24333B;--accent:#FF6A45;--accent-ink:#1A0E0A;--shadow:0 10px 30px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  color-scheme:dark;--sea:#123F55;--sea-2:#0A2A3A;--shore:#2E7C98;--land-1:#223528;--land-2:#1D3023;--land-3:#28392C;--land-4:#1A2B1F;--land-city:#3A3223;--land-hi:#5A3122;--border:#0F1C14;--label:#CFE3C8;--halo:#14231A;
  --ink:#E5ECEE;--muted:#9AABB2;--panel:#131E24;--line:#24333B;--accent:#FF6A45;--accent-ink:#1A0E0A;--shadow:0 10px 30px rgba(0,0,0,.5);}
html,body{height:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--display);font-stretch:95%;padding-inline:16px;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
.app{display:flex;flex-direction:column;height:100%;padding-block:14px;gap:12px;max-width:1400px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:750;font-stretch:78%;letter-spacing:-.01em;text-wrap:balance}
.brand{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px;gap:12px}
.mapwrap{position:relative;min-height:320px;border-radius:8px;overflow:hidden;background:radial-gradient(120% 90% at 70% 40%,var(--sea) 0%,var(--sea-2) 100%);border:1px solid var(--line);touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
svg.map{width:100%;height:100%;display:block}
.shore path{fill:var(--shore);stroke:var(--shore);stroke-width:7;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.55}
.communes path{stroke:var(--border);stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .2s}
.communes path.c0{fill:var(--land-1)}.communes path.c1{fill:var(--land-2)}.communes path.c2{fill:var(--land-3)}.communes path.c3{fill:var(--land-4)}
.communes path.city{fill:var(--land-city)}
.communes path.hi{fill:var(--land-hi)}
.lbl{font-family:var(--mono);font-weight:500;fill:var(--label);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--halo);stroke-width:3px;letter-spacing:.05em}
.pin{cursor:pointer}
.pin circle.halo{fill:var(--accent);opacity:.28}
.pin path{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.pin path{fill:var(--accent);stroke:#fff;stroke-width:1.6px}
.pin text{fill:var(--accent-ink);font-family:var(--mono);font-weight:500;text-anchor:middle;pointer-events:none}
.pin.on circle.halo{opacity:.35}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;border-radius:4px;overflow:hidden;box-shadow:var(--shadow)}
.zoom button{width:34px;height:34px;border:0;background:var(--panel);color:var(--ink);font:500 18px var(--mono);cursor:pointer}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scale{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:10px;color:#fff;display:flex;flex-direction:column;gap:2px}
.scale i{display:block;height:5px;border:1.5px solid #fff;border-top:0}
.pop{position:absolute;width:250px;background:var(--panel);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;transform:translate(-50%,calc(-100% - 34px));pointer-events:auto;cursor:default}
.pop img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.pop div{padding:10px 12px 12px}
.pop b{display:block;font-size:15px;font-weight:700;line-height:1.2}
.pop small{display:block;margin-top:4px;color:var(--muted);font-size:12.5px}
.pop a{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--accent);text-decoration:none}
.pop a:hover{text-decoration:underline}
.pop button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:15px;cursor:pointer;line-height:1}
.list{overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.count{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 0}
.card{all:unset;box-sizing:border-box;display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:start;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--border)}
.card.on{border-color:var(--accent)}
.card img{width:112px;aspect-ratio:4/3;object-fit:cover;border-radius:3px;display:block}
.card .ref{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--accent-ink);background:var(--accent);padding:1px 6px;border-radius:3px;letter-spacing:.06em}
.card h2{margin:2px 0 4px;font-size:16px;font-weight:700;line-height:1.2;text-wrap:balance}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.35}
footer{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
@media (max-width:760px){
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .mapwrap{height:58vh}
  .list{overflow:visible}
  .pop{width:210px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>Références chantiers</h1>
    <span class="brand">ID Maîtrise · Maîtrise d'œuvre · Le Havre</span>

  <div class="main">

      <div class="scale" id="scale"><span id="scaleTxt">1 km</span><i id="scaleBar"></i></div>

    <aside class="list" id="list" aria-label="Liste des chantiers"></aside>
  </div>
  <footer>Fond de carte : limites communales IGN / Etalab (licence ouverte).</footer>
</div>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map"), wrap = document.getElementById("mapwrap");
const proj = (lon, lat) => [(lon - MAP.box[0]) * MAP.k * MAP.sx, (MAP.box[3] - lat) * MAP.sx];
const kmPerUnit = 111.32 / MAP.sx; // 1 degré de latitude ≈ 111,32 km

const cg = document.getElementById("communes"), sg = document.getElementById("shore");
const avecChantier = nom => CHANTIERS.some(c => c.commune === nom || c.commune.startsWith(nom + " "));
MAP.paths.forEach(([nom, d], i) => {
  const s = document.createElementNS(NS, "path"); s.setAttribute("d", d); sg.appendChild(s);
  const p = document.createElementNS(NS, "path"); p.setAttribute("d", d);
  p.classList.add(avecChantier(nom) ? "hi" : nom === "Le Havre" ? "city" : "c" + ((i * 7) % 4));
  const t = document.createElementNS(NS, "title"); t.textContent = nom; p.appendChild(t);
  cg.appendChild(p);
});
const lg = document.getElementById("labels");
const lblEls = MAP.labels.map(([nom, x, y]) => {
  const t = document.createElementNS(NS, "text"); t.textContent = nom.toUpperCase();
  t.setAttribute("x", x); t.setAttribute("y", y); t.classList.add("lbl"); t.dataset.big = nom === "Le Havre" ? 1 : 0;
  lg.appendChild(t); return t;
});

/* pins + liste */
const pg = document.getElementById("pins"), list = document.getElementById("list");
const cnt = document.createElement("div"); cnt.className = "count";
cnt.textContent = CHANTIERS.length + (CHANTIERS.length > 1 ? " références" : " référence");

const pins = [], cards = [];
CHANTIERS.forEach((c, i) => {
  const [x, y] = proj(c.lon, c.lat); c.x = x; c.y = y;
  const g = document.createElementNS(NS, "g"); g.classList.add("pin"); g.setAttribute("tabindex", "0");
  g.setAttribute("role", "button"); g.setAttribute("aria-label", c.titre);
  g.innerHTML = `<circle class="halo" r="7"></circle><path d="M0 0C-3-7-11-11-11-19a11 11 0 0 1 22 0C11-11 3-7 0 0Z"></path><circle cy="-19" r="4" fill="#fff"></circle>`;
  g.addEventListener("click", e => { e.stopPropagation(); select(i, false); });
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i, false); } });
  pg.appendChild(g); pins.push(g);

  const b = document.createElement("button"); b.className = "card"; b.type = "button";
  b.innerHTML = `<img src="${c.photo}" alt="" loading="lazy"><div><h2></h2><p></p></div>`;
  b.querySelector("h2").textContent = c.titre;
  b.querySelector("p").textContent = `${c.adresse} — ${c.commune}`;
  b.addEventListener("click", () => select(i, true));
  list.appendChild(b); cards.push(b);
});

/* vue (viewBox) */
let vb = { x: 0, y: 0, w: MAP.W, h: MAP.H };
function aspect() { const r = wrap.getBoundingClientRect(); return r.width / Math.max(r.height, 1); }
function apply() {
  const a = aspect(); vb.h = vb.w / a;
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const px = vb.w / wrap.clientWidth; // unités par pixel
  pins.forEach((g, i) => g.setAttribute("transform", `translate(${CHANTIERS[i].x} ${CHANTIERS[i].y}) scale(${px})`));
  lblEls.forEach(t => { const big = t.dataset.big === "1"; t.setAttribute("font-size", (big ? 12 : 9.5) * px); t.style.strokeWidth = 3 * px; });
  const u = vb.w / MAP.W; lblEls.forEach(t => t.style.display = (t.dataset.big === "1" || u < 0.75) ? "" : "none");
  // échelle
  const targets = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20]; const kmPx = kmPerUnit * px;
  let km = targets.find(k => k / kmPx >= 60) || 20;
  document.getElementById("scaleBar").style.width = (km / kmPx) + "px";
  document.getElementById("scaleTxt").textContent = km < 1 ? km * 1000 + " m" : km + " km";
  placePop();
}
function fit(anim) {
  const xs = CHANTIERS.map(c => c.x), ys = CHANTIERS.map(c => c.y);
  const minSpan = 300; // vue d'ensemble de l'agglomération au minimum
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let w = Math.max(x1 - x0, minSpan) * 1.4, h = Math.max(y1 - y0, minSpan / aspect()) * 1.4;
  w = Math.max(w, h * aspect());
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  go({ x: cx - w / 2, y: cy - w / aspect() * 0.62, w }, anim);
}
let raf;
function go(t, anim) {
  cancelAnimationFrame(raf);
  if (!anim || matchMedia("(prefers-reduced-motion: reduce)").matches) { vb.x = t.x; vb.y = t.y; vb.w = t.w; return apply(); }
  const s = { ...vb }, t0 = performance.now();
  const step = n => { const k = Math.min((n - t0) / 450, 1), e = 1 - Math.pow(1 - k, 3);
    vb.x = s.x + (t.x - s.x) * e; vb.y = s.y + (t.y - s.y) * e; vb.w = s.w + (t.w - s.w) * e; apply();
    if (k < 1) raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
}
function zoomAt(f, px, py) {
  const r = wrap.getBoundingClientRect();
  const mx = vb.x + (px - r.left) / r.width * vb.w, my = vb.y + (py - r.top) / r.height * vb.h;
  const nw = Math.min(Math.max(vb.w * f, 8), MAP.W * 1.2);
  const k = nw / vb.w; vb.x = mx - (mx - vb.x) * k; vb.y = my - (my - vb.y) * k; vb.w = nw; apply();
}
wrap.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
const ptrs = new Map(); let lastDist = 0, moved = false;
wrap.addEventListener("pointerdown", e => { if (e.target.closest(".zoom,.pop")) return; ptrs.set(e.pointerId, e); wrap.setPointerCapture(e.pointerId); wrap.classList.add("drag"); moved = false; });
wrap.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, e);
  if (ptrs.size === 1) {
    const dx = e.clientX - prev.clientX, dy = e.clientY - prev.clientY; if (Math.abs(dx) + Math.abs(dy) > 1) moved = true;
    const u = vb.w / wrap.clientWidth; vb.x -= dx * u; vb.y -= dy * u; apply();
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (lastDist) zoomAt(lastDist / d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); lastDist = d; moved = true;
  }
});
const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) lastDist = 0; if (!ptrs.size) wrap.classList.remove("drag"); };
wrap.addEventListener("pointerup", e => { up(e); if (!moved && !e.target.closest(".pin,.pop,.zoom")) closePop(); });
wrap.addEventListener("pointercancel", up);
const mid = () => { const r = wrap.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
document.getElementById("zin").onclick = () => zoomAt(0.6, ...mid());
document.getElementById("zout").onclick = () => zoomAt(1 / 0.6, ...mid());
document.getElementById("zfit").onclick = () => { closePop(); fit(true); };

/* sélection + popup */
let cur = -1, pop = null;
function select(i, fly) {
  cur = i; pins.forEach((p, j) => p.classList.toggle("on", j === i)); cards.forEach((c, j) => c.classList.toggle("on", j === i));
  const c = CHANTIERS[i]; closePop(true);
  pop = document.createElement("div"); pop.className = "pop";
  pop.innerHTML = `<img src="${c.photo}" alt="" loading="lazy"><div><b></b><small></small><a target="_blank" rel="noopener">Voir sur Google Maps ↗</a></div><button aria-label="Fermer">×</button>`;
  pop.querySelector("img").alt = c.titre; pop.querySelector("b").textContent = c.titre; pop.querySelector("small").textContent = `${c.adresse} — ${c.commune}`;
  pop.querySelector("a").href = `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lon}`;
  pop.querySelector("button").onclick = () => closePop();
  wrap.appendChild(pop);
  if (fly) { const w = Math.min(vb.w, 160); go({ x: c.x - w / 2, y: c.y - w / aspect() / 2 - w / aspect() * 0.2, w }, true); }
  else placePop();
  if (!fly && innerWidth <= 760) {} else if (!fly) cards[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function placePop() {
  if (!pop || cur < 0) return;
  const c = CHANTIERS[cur], r = wrap.getBoundingClientRect();
  let left = (c.x - vb.x) / vb.w * r.width, top = (c.y - vb.y) / vb.h * r.height;
  pop.style.left = left + "px"; pop.style.top = top + "px";
}
function closePop(keep) { if (pop) pop.remove(); pop = null; if (!keep) { cur = -1; pins.forEach(p => p.classList.remove("on")); cards.forEach(c => c.classList.remove("on")); } }

new ResizeObserver(() => apply()).observe(wrap);
fit(false);
if (CHANTIERS.length === 1 && innerWidth > 760) select(0, false);
})();
</script>
