<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="panneauTitle">
  <title id="panneauTitle">Panneau réglementaire de permis de construire planté en bordure de terrain, avec une maison en construction à l'arrière-plan</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f0eb"/>
      <stop offset="100%" stop-color="#e4e0d7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- ground -->
  <rect x="0" y="486" width="1200" height="144" fill="#e4e0d7"/>
  <line x1="0" y1="486" x2="1200" y2="486" stroke="#939b96" stroke-width="1.5"/>

  <!-- house under construction, background -->
  <g stroke="#5a645e" stroke-width="3" fill="none" opacity="0.55">
    <polyline points="760,486 760,330 900,240 1040,330 1040,486"/>
    <line x1="738" y1="486" x2="1062" y2="486"/>
    <line x1="900" y1="240" x2="900" y2="200"/>
    <rect x="800" y="380" width="60" height="106"/>
    <rect x="940" y="380" width="60" height="60"/>
  </g>
  <g stroke="#a9884f" stroke-width="3" opacity="0.55">
    <line x1="760" y1="330" x2="1040" y2="330"/>
    <line x1="760" y1="400" x2="1040" y2="400"/>
  </g>

  <!-- sight line from road to panel -->
  <path d="M 60 560 Q 260 460 430 400" stroke="#a9884f" stroke-width="2" stroke-dasharray="2 10" fill="none" opacity="0.7"/>

  <!-- panel posts -->
  <rect x="365" y="330" width="14" height="180" fill="#5a645e"/>
  <rect x="505" y="330" width="14" height="180" fill="#5a645e"/>

  <!-- panel board -->
  <g>
    <rect x="330" y="150" width="230" height="200" fill="#f8f7f4" stroke="#1b1f1d" stroke-width="4"/>
    <rect x="330" y="150" width="230" height="34" fill="#1b1f1d"/>
    <text x="445" y="174" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#f8f7f4" letter-spacing="1">PERMIS DE CONSTRUIRE</text>

    <g fill="none" stroke="#a9884f" stroke-width="4">
      <line x1="352" y1="206" x2="538" y2="206"/>
      <line x1="352" y1="230" x2="538" y2="230"/>
      <line x1="352" y1="254" x2="480" y2="254"/>
    </g>
    <g fill="none" stroke="#939b96" stroke-width="3">
      <line x1="352" y1="282" x2="538" y2="282"/>
      <line x1="352" y1="300" x2="538" y2="300"/>
      <line x1="352" y1="318" x2="500" y2="318"/>
    </g>
  </g>

  <!-- visibility distance callout -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1b1f1d">
    <circle cx="90" cy="556" r="5" fill="#a9884f"/>
    <text x="108" y="562" font-size="18">Visible depuis la voie publique</text>
  </g>

  <!-- foreground rule matching site brand mark -->
  <rect x="60" y="80" width="64" height="4" fill="#a9884f"/>
</svg>
