<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="es-title" fill="none">
  <title id="es-title">Coupe d&#8217;un terrain argileux : en été le sol sec se rétracte et la fondation d&#8217;une maison se fissure, en hiver il gonfle ; des fondations plus profondes stabilisent la construction</title>
  <rect width="1200" height="630" fill="#f2f0eb" />
  <g font-family="Lato, sans-serif" fill="#1b1f1d">
    <text x="60" y="66" font-size="12" font-weight="700" letter-spacing="2.6">CONSEILS</text>
    <text x="60" y="88" font-size="20" opacity="0.85">Étude de sol et argiles</text>
  </g>
  <!-- sol -->
  <rect x="60" y="400" width="1080" height="170" fill="rgba(169,136,79,0.16)" />
  <line x1="60" y1="400" x2="1140" y2="400" stroke="#1b1f1d" stroke-width="1.6" />
  <!-- maison -->
  <g stroke="#1b1f1d" stroke-width="1.6">
    <rect x="440" y="260" width="320" height="140" fill="rgba(255,255,255,0.5)" />
    <path d="M424 260 L600 170 L776 260 Z" fill="rgba(255,255,255,0.5)" />
    <rect x="560" y="320" width="64" height="80" fill="rgba(34,53,44,0.05)" stroke-width="1.1" />
    <!-- fondations profondes -->
    <rect x="440" y="400" width="26" height="130" fill="rgba(34,53,44,0.12)" />
    <rect x="734" y="400" width="26" height="130" fill="rgba(34,53,44,0.12)" />
  </g>
  <!-- couche stable -->
  <line x1="60" y1="530" x2="1140" y2="530" stroke="#a9884f" stroke-width="1.4" stroke-dasharray="8 6" />
  <!-- flèches retrait / gonflement -->
  <g stroke="#a9884f" stroke-width="1.6">
    <line x1="250" y1="440" x2="250" y2="410" /><line x1="250" y1="440" x2="244" y2="432" /><line x1="250" y1="440" x2="256" y2="432" />
    <line x1="950" y1="410" x2="950" y2="440" /><line x1="950" y1="440" x2="944" y2="432" /><line x1="950" y1="440" x2="956" y2="432" />
  </g>
  <g font-family="Lato, sans-serif" text-anchor="middle" fill="#1b1f1d">
    <text x="250" y="468" font-size="13" font-weight="700" letter-spacing="2.2" fill="#a9884f">ÉTÉ : RETRAIT</text>
    <text x="250" y="490" font-size="14" fill="#5a645e">le sol sèche et se tasse</text>
    <text x="950" y="468" font-size="13" font-weight="700" letter-spacing="2.2" fill="#a9884f">HIVER : GONFLEMENT</text>
    <text x="950" y="490" font-size="14" fill="#5a645e">le sol absorbe l&#8217;eau</text>
    <text x="600" y="556" font-size="14" fill="#5a645e">Fondations descendues dans la couche stable</text>
  </g>
</svg>
