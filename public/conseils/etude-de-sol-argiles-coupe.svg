<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ec-title" fill="none">
  <title id="ec-title">Les trois niveaux d&#8217;exposition aux argiles et les obligations associées : faible, moyen et fort</title>
  <rect width="1200" height="630" fill="#f2f0eb" />
  <g font-family="Lato, sans-serif" fill="#1b1f1d">
    <text x="60" y="66" font-size="12" font-weight="700" letter-spacing="2.6">CONSEILS</text>
    <text x="60" y="88" font-size="20" opacity="0.85">Exposition aux argiles : que faut-il faire ?</text>
  </g>
  <g stroke="#1b1f1d" stroke-width="1.2">
    <rect x="60" y="180" width="340" height="300" fill="rgba(34,53,44,0.05)" />
    <rect x="430" y="180" width="340" height="300" fill="rgba(169,136,79,0.16)" stroke="#a9884f" stroke-width="1.4" />
    <rect x="800" y="180" width="340" height="300" fill="rgba(169,136,79,0.3)" stroke="#a9884f" stroke-width="1.4" />
  </g>
  <g font-family="Lato, sans-serif" text-anchor="middle" fill="#1b1f1d">
    <text x="230" y="230" font-size="13" font-weight="700" letter-spacing="2.2" fill="#a9884f">EXPOSITION FAIBLE</text>
    <text x="230" y="300" font-size="15">Pas d&#8217;obligation légale</text>
    <text x="230" y="326" font-size="14" fill="#5a645e">Étude de sol conseillée</text>
    <text x="600" y="230" font-size="13" font-weight="700" letter-spacing="2.2" fill="#a9884f">EXPOSITION MOYENNE</text>
    <text x="600" y="300" font-size="15">G1 à la vente du terrain</text>
    <text x="600" y="326" font-size="15">G2 ou techniques adaptées</text>
    <text x="970" y="230" font-size="13" font-weight="700" letter-spacing="2.2" fill="#a9884f">EXPOSITION FORTE</text>
    <text x="970" y="300" font-size="15">G1 à la vente du terrain</text>
    <text x="970" y="326" font-size="15">G2 ou techniques adaptées</text>
    <text x="970" y="400" font-size="14" fill="#5a645e">Vigilance maximale</text>
  </g>
</svg>
