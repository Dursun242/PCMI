<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="pcm-ba-title" fill="none">
  <title id="pcm-ba-title">Deux façades côte à côte : à gauche le projet accordé, à droite le même projet avec une fenêtre déplacée, ce qui relève d'un permis modificatif</title>

  <rect width="1200" height="420" fill="#f2f0eb" />

  <!-- AVANT -->
  <g stroke="#1b1f1d" stroke-width="1.5">
    <line x1="60" y1="340" x2="560" y2="340" />
    <rect x="130" y="200" width="360" height="140" fill="rgba(255,255,255,0.5)" />
    <path d="M114 200 L310 116 L506 200 Z" fill="rgba(255,255,255,0.5)" />
  </g>
  <g stroke="#1b1f1d" stroke-width="1.1">
    <rect x="160" y="224" width="70" height="44" />
    <line x1="195" y1="224" x2="195" y2="268" stroke-width="0.8" />
    <rect x="390" y="224" width="70" height="44" />
    <line x1="425" y1="224" x2="425" y2="268" stroke-width="0.8" />
    <rect x="276" y="262" width="52" height="78" fill="rgba(169,136,79,0.28)" />
  </g>
  <g font-family="Lato, sans-serif" fill="#1b1f1d">
    <text x="60" y="52" font-size="12" font-weight="700" letter-spacing="2.6">PERMIS ACCORDÉ</text>
    <text x="60" y="76" font-size="16" opacity="0.85">Le projet tel qu&#8217;autorisé</text>
  </g>

  <!-- flèche centrale -->
  <g stroke="#a9884f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M580 230 H620" />
    <path d="M610 222 L620 230 L610 238" />
  </g>

  <!-- APRÈS -->
  <g stroke="#1b1f1d" stroke-width="1.5">
    <line x1="640" y1="340" x2="1140" y2="340" />
    <rect x="710" y="200" width="360" height="140" fill="rgba(255,255,255,0.5)" />
    <path d="M694 200 L890 116 L1086 200 Z" fill="rgba(255,255,255,0.5)" />
  </g>
  <g stroke="#939b96" stroke-width="1" stroke-dasharray="5 4">
    <rect x="740" y="224" width="70" height="44" />
  </g>
  <g stroke="#1b1f1d" stroke-width="1.1">
    <rect x="778" y="224" width="70" height="44" fill="rgba(169,136,79,0.18)" />
    <line x1="813" y1="224" x2="813" y2="268" stroke-width="0.8" />
    <rect x="970" y="224" width="70" height="44" />
    <line x1="1005" y1="224" x2="1005" y2="268" stroke-width="0.8" />
    <rect x="856" y="262" width="52" height="78" fill="rgba(169,136,79,0.28)" />
  </g>
  <g font-family="Lato, sans-serif" fill="#1b1f1d">
    <text x="640" y="52" font-size="12" font-weight="700" letter-spacing="2.6" fill="#a9884f">PC MODIFICATIF</text>
    <text x="640" y="76" font-size="16" opacity="0.85">Même maison, une fenêtre déplacée</text>
  </g>
  <g font-family="Lato, sans-serif" font-size="12" fill="#5a645e" text-anchor="middle">
    <text x="310" y="376">Surface, hauteur, emprise : inchangées</text>
    <text x="890" y="376">Détail modifié : on complète le dossier</text>
  </g>
</svg>
