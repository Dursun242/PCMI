<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="noticeTitle">
  <title id="noticeTitle">Notice descriptive PCMI 4 présentée en deux colonnes, état initial du terrain à gauche et présentation du projet à droite, avec leurs rubriques</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f0eb"/>
      <stop offset="100%" stop-color="#e4e0d7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand rule -->
  <rect x="60" y="70" width="64" height="4" fill="#a9884f"/>
  <text x="60" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1b1f1d">Notice descriptive — PCMI 4</text>

  <!-- sheet -->
  <rect x="60" y="158" width="1080" height="410" fill="#f8f7f4" stroke="#1b1f1d" stroke-width="3"/>
  <line x1="600" y1="158" x2="600" y2="568" stroke="#939b96" stroke-width="1.5" stroke-dasharray="3 8"/>

  <!-- left column: état initial -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1b1f1d">
    <text x="92" y="200" font-size="19" letter-spacing="0.5">1. État initial du terrain</text>
  </g>
  <g fill="none" stroke="#a9884f" stroke-width="3">
    <line x1="92" y1="228" x2="560" y2="228"/>
    <line x1="92" y1="256" x2="530" y2="256"/>
    <line x1="92" y1="284" x2="545" y2="284"/>
    <line x1="92" y1="312" x2="500" y2="312"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5a645e">
    <text x="92" y="222">Topographie, pente</text>
    <text x="92" y="250">Constructions existantes</text>
    <text x="92" y="278">Végétation à conserver</text>
    <text x="92" y="306">Accès et réseaux en limite</text>
  </g>

  <!-- small terrain sketch, left -->
  <g stroke="#5a645e" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M 92 470 L 220 430 L 340 470 L 340 520 L 92 520 Z"/>
    <circle cx="300" cy="450" r="16"/>
    <line x1="300" y1="466" x2="300" y2="490"/>
  </g>

  <!-- right column: projet -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1b1f1d">
    <text x="632" y="200" font-size="19" letter-spacing="0.5">2. Présentation du projet</text>
  </g>
  <g fill="none" stroke="#a9884f" stroke-width="3">
    <line x1="632" y1="228" x2="1100" y2="228"/>
    <line x1="632" y1="256" x2="1070" y2="256"/>
    <line x1="632" y1="284" x2="1085" y2="284"/>
    <line x1="632" y1="312" x2="1040" y2="312"/>
    <line x1="632" y1="340" x2="1090" y2="340"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5a645e">
    <text x="632" y="222">Implantation</text>
    <text x="632" y="250">Organisation du terrain</text>
    <text x="632" y="278">Volumétrie, hauteur, toiture</text>
    <text x="632" y="306">Matériaux et couleurs</text>
    <text x="632" y="334">Raccordement aux réseaux</text>
  </g>

  <!-- small house sketch, right -->
  <g stroke="#5a645e" stroke-width="2.5" fill="none" opacity="0.7">
    <polyline points="900,530 900,450 970,405 1040,450 1040,530"/>
    <line x1="885" y1="530" x2="1055" y2="530"/>
    <rect x="915" y="475" width="28" height="55"/>
    <rect x="985" y="470" width="30" height="30"/>
  </g>
  <g stroke="#a9884f" stroke-width="2.5" opacity="0.8">
    <line x1="900" y1="450" x2="1040" y2="450"/>
  </g>

  <!-- caption -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1b1f1d">
    <circle cx="92" cy="592" r="5" fill="#a9884f"/>
    <text x="110" y="598" font-size="16">Deux parties, une seule cohérence avec le reste du dossier</text>
  </g>
</svg>
