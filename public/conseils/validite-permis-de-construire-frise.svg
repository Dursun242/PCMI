<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="fr-title" fill="none">
  <title id="fr-title">Frise de la vie d'un permis : notification, trois ans de validité, deux prorogations d'un an, soit cinq ans au maximum</title>
  <rect width="1200" height="630" fill="#f2f0eb" />
  <g font-family="Lato, sans-serif" fill="#1b1f1d">
    <text x="60" y="66" font-size="12" font-weight="700" letter-spacing="2.6">CONSEILS</text>
    <text x="60" y="88" font-size="20" opacity="0.85">La vie d&#8217;un permis de construire</text>
  </g>
  <!-- axe: 5 ans = 1000px, 200px par an, depuis x=100 -->
  <line x1="100" y1="330" x2="1100" y2="330" stroke="#1b1f1d" stroke-width="1.6" />
  <g stroke="#1b1f1d" stroke-width="1.2">
    <line x1="100" y1="318" x2="100" y2="342" /><line x1="700" y1="318" x2="700" y2="342" />
    <line x1="900" y1="318" x2="900" y2="342" /><line x1="1100" y1="318" x2="1100" y2="342" />
  </g>
  <rect x="100" y="262" width="600" height="44" fill="rgba(34,53,44,0.08)" stroke="#1b1f1d" stroke-width="1.2" />
  <rect x="700" y="262" width="200" height="44" fill="rgba(169,136,79,0.2)" stroke="#a9884f" stroke-width="1.4" />
  <rect x="900" y="262" width="200" height="44" fill="rgba(169,136,79,0.2)" stroke="#a9884f" stroke-width="1.4" />
  <g font-family="Lato, sans-serif" fill="#1b1f1d" text-anchor="middle">
    <text x="400" y="290" font-size="16" font-weight="700">3 ans de validité</text>
    <text x="800" y="290" font-size="14" font-weight="700">+ 1 an</text>
    <text x="1000" y="290" font-size="14" font-weight="700">+ 1 an</text>
    <text x="100" y="372" font-size="13" fill="#5a645e">Notification</text>
    <text x="700" y="372" font-size="13" fill="#5a645e">An 3</text>
    <text x="900" y="372" font-size="13" fill="#5a645e">An 4</text>
    <text x="1100" y="372" font-size="13" fill="#5a645e">An 5 : maximum</text>
  </g>
  <!-- rappels -->
  <g stroke="#a9884f" stroke-width="1.4"><line x1="660" y1="200" x2="660" y2="262" /><line x1="860" y1="200" x2="860" y2="262" /></g>
  <g font-family="Lato, sans-serif" font-size="13" fill="#a9884f" text-anchor="middle" font-weight="700">
    <text x="660" y="190">Demande ≥ 2 mois avant</text><text x="860" y="190">Demande ≥ 2 mois avant</text>
  </g>
  <!-- démarrage -->
  <g stroke="#1b1f1d" stroke-width="1.2"><line x1="400" y1="440" x2="400" y2="342" /></g>
  <g font-family="Lato, sans-serif" font-size="14" fill="#1b1f1d" text-anchor="middle">
    <text x="400" y="462">Les travaux doivent démarrer dans ce délai</text>
    <text x="400" y="482" fill="#5a645e" font-size="13">puis ne pas être interrompus plus d&#8217;un an</text>
  </g>
</svg>
