<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="pcm-title" fill="none">
  <title id="pcm-title">Façade de maison dont une fenêtre a été déplacée, avec le dossier de permis modificatif tamponné au premier plan</title>

  <rect width="1200" height="630" fill="#f2f0eb" />

  <!-- sol -->
  <line x1="60" y1="486" x2="1140" y2="486" stroke="#1b1f1d" stroke-width="1.6" />

  <!-- maison, façade au trait -->
  <g stroke="#1b1f1d" stroke-width="1.6">
    <rect x="280" y="256" width="430" height="230" fill="rgba(255,255,255,0.5)" />
    <path d="M262 256 L495 150 L728 256 Z" fill="rgba(255,255,255,0.5)" />
    <line x1="258" y1="258" x2="732" y2="258" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- annexe bois -->
  <g stroke="#1b1f1d" stroke-width="1.4">
    <rect x="710" y="330" width="150" height="156" fill="rgba(169,136,79,0.12)" />
    <line x1="704" y1="330" x2="866" y2="330" stroke-width="2" stroke-linecap="round" />
    <g stroke="#a9884f" stroke-width="0.7">
      <line x1="716" y1="342" x2="854" y2="342" />
      <line x1="716" y1="356" x2="854" y2="356" />
      <line x1="716" y1="370" x2="854" y2="370" />
      <line x1="716" y1="384" x2="854" y2="384" />
      <line x1="716" y1="398" x2="854" y2="398" />
    </g>
  </g>

  <!-- baie vitrée -->
  <g stroke="#1b1f1d" stroke-width="1.1">
    <rect x="326" y="356" width="150" height="130" fill="rgba(34,53,44,0.05)" />
    <line x1="401" y1="356" x2="401" y2="486" stroke-width="0.8" />
  </g>

  <!-- porte -->
  <g stroke="#1b1f1d" stroke-width="1.1">
    <rect x="520" y="382" width="58" height="104" fill="rgba(169,136,79,0.28)" />
    <line x1="566" y1="432" x2="566" y2="444" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <!-- fenêtre étage : emplacement d'origine en pointillé, nouvelle position pleine -->
  <g stroke="#939b96" stroke-width="1" stroke-dasharray="5 4">
    <rect x="330" y="286" width="80" height="50" />
  </g>
  <g stroke="#1b1f1d" stroke-width="1.1">
    <rect x="410" y="286" width="80" height="50" fill="rgba(169,136,79,0.18)" />
    <line x1="450" y1="286" x2="450" y2="336" stroke-width="0.8" />
    <rect x="590" y="286" width="80" height="50" />
    <line x1="630" y1="286" x2="630" y2="336" stroke-width="0.8" />
  </g>
  <!-- flèche du déplacement -->
  <g stroke="#a9884f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M346 272 H470" />
    <path d="M460 266 L470 272 L460 278" />
  </g>

  <!-- arbre -->
  <g stroke="#5a645e" stroke-width="1.1">
    <line x1="1000" y1="486" x2="1000" y2="380" />
    <path d="M1000 380c-38 0-58-30-50-60 8-28 38-38 50-38s42 10 50 38c8 30-12 60-50 60Z" />
  </g>

  <!-- cotes -->
  <g stroke="#1b1f1d" stroke-width="0.8">
    <line x1="280" y1="516" x2="710" y2="516" />
    <line x1="280" y1="508" x2="280" y2="524" />
    <line x1="710" y1="508" x2="710" y2="524" />
  </g>
  <g font-family="Lato, sans-serif" font-size="12" fill="#5a645e" text-anchor="middle">
    <text x="495" y="538">Le projet reste le même : seul un détail change</text>
  </g>

  <!-- dossier au premier plan avec tampon -->
  <g transform="translate(790 396) rotate(-4)">
    <rect x="0" y="0" width="330" height="176" rx="3" fill="#fcfbf9" stroke="#1b1f1d" stroke-width="1.4" />
    <g font-family="Lato, sans-serif" fill="#1b1f1d">
      <text x="24" y="34" font-size="14" font-weight="700" letter-spacing="1.6">PC MODIFICATIF</text>
      <text x="24" y="54" font-size="10.5" fill="#5a645e">Demande de modification d&#8217;un permis</text>
      <text x="24" y="68" font-size="10.5" fill="#5a645e">de construire déjà accordé</text>
    </g>
    <g stroke="#e4e0d7" stroke-width="4" stroke-linecap="round">
      <line x1="24" y1="92" x2="306" y2="92" />
      <line x1="24" y1="108" x2="306" y2="108" />
      <line x1="24" y1="124" x2="230" y2="124" />
    </g>
    <g transform="translate(258 138)">
      <circle r="34" fill="none" stroke="#a9884f" stroke-width="2.4" />
      <circle r="27" fill="none" stroke="#a9884f" stroke-width="1" stroke-dasharray="2 3" />
      <path d="M-13 1l9 9 18-20" fill="none" stroke="#a9884f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="0" y="-40" font-family="Lato, sans-serif" font-size="8" font-weight="700" fill="#a9884f" text-anchor="middle" letter-spacing="1.5">DÉPOSÉ EN MAIRIE</text>
    </g>
  </g>

  <!-- cartouche -->
  <g font-family="Lato, sans-serif" fill="#1b1f1d">
    <text x="60" y="66" font-size="12" font-weight="700" letter-spacing="2.6">CONSEILS</text>
    <text x="60" y="88" font-size="20" opacity="0.85">Changer en cours de route — le permis modificatif</text>
  </g>
  <g transform="translate(1128 60)" stroke="#1b1f1d" stroke-width="1">
    <circle r="16" />
    <path d="M0 -12v24M0 -12l-5 8h10Z" fill="#1b1f1d" />
  </g>
</svg>
