<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="pcm-cal-title" fill="none">
  <title id="pcm-cal-title">Frise du chantier : dépôt, permis accordé, travaux, DAACT ; le permis modificatif se demande pendant les travaux, avant la déclaration d'achèvement</title>

  <rect width="1200" height="420" fill="#f2f0eb" />

  <g font-family="Lato, sans-serif" fill="#1b1f1d">
    <text x="60" y="52" font-size="12" font-weight="700" letter-spacing="2.6">LE BON MOMENT</text>
    <text x="60" y="76" font-size="16" opacity="0.85">Un modificatif se dépose avant la fin du chantier</text>
  </g>

  <!-- ligne de temps -->
  <line x1="100" y1="230" x2="1100" y2="230" stroke="#1b1f1d" stroke-width="1.6" />
  <g stroke="#1b1f1d" stroke-width="1.4" fill="#f2f0eb">
    <circle cx="140" cy="230" r="11" />
    <circle cx="400" cy="230" r="11" />
    <circle cx="1060" cy="230" r="11" />
  </g>
  <g font-family="Lato, sans-serif" fill="#1b1f1d" text-anchor="middle">
    <text x="140" y="268" font-size="14" font-weight="700">Dépôt</text>
    <text x="140" y="288" font-size="12" fill="#5a645e">du permis</text>
    <text x="400" y="268" font-size="14" font-weight="700">Permis accordé</text>
    <text x="400" y="288" font-size="12" fill="#5a645e">le projet est figé</text>
    <text x="1060" y="268" font-size="14" font-weight="700">DAACT</text>
    <text x="1060" y="288" font-size="12" fill="#5a645e">fin de chantier</text>
  </g>

  <!-- période travaux -->
  <g>
    <rect x="400" y="200" width="660" height="30" fill="rgba(169,136,79,0.18)" stroke="none" />
    <line x1="400" y1="200" x2="1060" y2="200" stroke="#a9884f" stroke-width="1.6" />
  </g>
  <g font-family="Lato, sans-serif" fill="#a9884f" text-anchor="middle">
    <text x="730" y="186" font-size="12" font-weight="700" letter-spacing="2">LES TRAVAUX : LE MODIFICATIF EST POSSIBLE</text>
  </g>

  <!-- marqueurs modificatif -->
  <g stroke="#a9884f" stroke-width="1.6" fill="#fcfbf9">
    <rect x="560" y="316" width="140" height="44" rx="3" />
  </g>
  <g font-family="Lato, sans-serif" fill="#1b1f1d" text-anchor="middle">
    <text x="630" y="335" font-size="12" font-weight="700">PC modificatif</text>
    <text x="630" y="351" font-size="11" fill="#5a645e">mêmes 2 mois</text>
  </g>
  <line x1="630" y1="316" x2="630" y2="242" stroke="#a9884f" stroke-width="1.2" stroke-dasharray="4 3" />

  <!-- fin de fenêtre -->
  <g stroke="#1b1f1d" stroke-width="1.2" stroke-dasharray="3 4">
    <line x1="1060" y1="130" x2="1060" y2="214" />
  </g>
  <g font-family="Lato, sans-serif" font-size="11" fill="#5a645e" text-anchor="end">
    <text x="1050" y="140">Après la DAACT, trop tard</text>
  </g>
</svg>
